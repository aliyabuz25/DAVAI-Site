<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DAVAI Admin — Setup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
  body { background:#000; color:#fff; font-family:-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .setup-card { background:#111; border:1px solid #222; border-radius:12px; padding:40px; width:100%; max-width:400px; }
  .setup-card h1 { font-size:1.2rem; font-weight:700; letter-spacing:.12em; margin-bottom:6px; }
  .setup-card p  { font-size:.82rem; color:#666; margin-bottom:28px; }
  .form-label    { font-size:.75rem; font-weight:600; color:#888; letter-spacing:.04em; text-transform:uppercase; }
  .form-control  { background:#1a1a1a; border:1px solid #2a2a2a; color:#fff; border-radius:8px; }
  .form-control:focus { background:#1a1a1a; border-color:#fff; color:#fff; box-shadow:none; }
  .btn-setup { background:#fff; color:#000; border:none; border-radius:8px; font-weight:700; height:44px; width:100%; font-size:.9rem; transition:opacity .15s; }
  .btn-setup:hover { opacity:.85; }
  .err { background:rgba(220,53,69,.12); border:1px solid rgba(220,53,69,.3); color:#ff6b6b; border-radius:8px; padding:10px 14px; font-size:.82rem; display:none; margin-bottom:16px; }
  .wordmark { font-size:.85rem; font-weight:800; letter-spacing:.18em; color:#fff; }
</style>
</head>
<body>
<div class="setup-card">
  <div class="wordmark mb-1">DAVAI</div>
  <h1>Create Admin Account</h1>
  <p>This runs once. Set your credentials to access the admin panel.</p>

  <div class="err" id="err"></div>

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input class="form-control" id="username" type="text" placeholder="admin" autocomplete="off"/>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input class="form-control" id="password" type="password" placeholder="Min. 8 characters"/>
  </div>
  <div class="mb-4">
    <label class="form-label">Confirm Password</label>
    <input class="form-control" id="confirm" type="password" placeholder="Repeat password"/>
  </div>
  <button class="btn-setup" id="submitBtn" onclick="doSetup()">Create Account</button>
</div>

<script>
async function doSetup() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const c = document.getElementById('confirm').value;
  const err = document.getElementById('err');
  err.style.display = 'none';

  if (!u) return showErr('Username is required.');
  if (p.length < 8) return showErr('Password must be at least 8 characters.');
  if (p !== c) return showErr('Passwords do not match.');

  document.getElementById('submitBtn').textContent = 'Creating...';
  document.getElementById('submitBtn').disabled = true;

  try {
    const res = await fetch('/admin/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) return showErr(data.message || 'Setup failed.');
    window.location.href = '/admin/login';
  } catch {
    showErr('Network error. Is the server running?');
  } finally {
    document.getElementById('submitBtn').textContent = 'Create Account';
    document.getElementById('submitBtn').disabled = false;
  }
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doSetup(); });

// If setup already done, redirect to login
(async function() {
  try {
    const res = await fetch('/admin/api/setup-status');
    if (res.ok) {
      const d = await res.json();
      if (d.done) window.location.href = '/admin/login';
    }
  } catch {}
})();
</script>
</body>
</html>
