<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DAVAI Admin — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
  body { background:#000; color:#fff; font-family:-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#111; border:1px solid #222; border-radius:12px; padding:40px; width:100%; max-width:380px; }
  h1 { font-size:1.15rem; font-weight:700; margin-bottom:6px; }
  p  { font-size:.82rem; color:#666; margin-bottom:28px; }
  .form-label   { font-size:.75rem; font-weight:600; color:#888; letter-spacing:.04em; text-transform:uppercase; }
  .form-control { background:#1a1a1a; border:1px solid #2a2a2a; color:#fff; border-radius:8px; }
  .form-control:focus { background:#1a1a1a; border-color:#fff; color:#fff; box-shadow:none; }
  .btn-login { background:#fff; color:#000; border:none; border-radius:8px; font-weight:700; height:44px; width:100%; font-size:.9rem; transition:opacity .15s; }
  .btn-login:hover { opacity:.85; }
  .err { background:rgba(220,53,69,.12); border:1px solid rgba(220,53,69,.3); color:#ff6b6b; border-radius:8px; padding:10px 14px; font-size:.82rem; display:none; margin-bottom:16px; }
  .wordmark { font-size:.85rem; font-weight:800; letter-spacing:.18em; color:#fff; }
</style>
</head>
<body>
<div class="login-card">
  <div class="wordmark mb-1">DAVAI</div>
  <h1>Admin Panel</h1>
  <p>Sign in to manage users, payments and settings.</p>

  <div class="err" id="err"></div>

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input class="form-control" id="username" type="text" autocomplete="username"/>
  </div>
  <div class="mb-4">
    <label class="form-label">Password</label>
    <input class="form-control" id="password" type="password" autocomplete="current-password"/>
  </div>
  <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In</button>
</div>

<script>
// If setup not done yet, redirect to setup
(async function() {
  try {
    const res = await fetch('/admin/api/setup-status');
    if (res.ok) {
      const d = await res.json();
      if (!d.done) { window.location.href = '/admin/setup'; return; }
    }
  } catch {}
})();

async function doLogin() {
  const u   = document.getElementById('username').value.trim();
  const p   = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';

  if (!u || !p) return showErr('Enter username and password.');

  document.getElementById('loginBtn').textContent = 'Signing in...';
  document.getElementById('loginBtn').disabled = true;

  try {
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) return showErr(data.message || 'Invalid credentials.');
    localStorage.setItem('davai_admin_token', data.token);
    window.location.href = '/admin/';
  } catch {
    showErr('Network error.');
  } finally {
    document.getElementById('loginBtn').textContent = 'Sign In';
    document.getElementById('loginBtn').disabled = false;
  }
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
