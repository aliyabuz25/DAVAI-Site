<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1629"/>
      <stop offset="100%" style="stop-color:#151f38"/>
    </linearGradient>
    <linearGradient id="orb1g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f26522;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#f26522;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orb2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f26522"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Orbs -->
  <circle cx="200" cy="150" r="300" fill="url(#orb1g)" filter="url(#blur1)"/>
  <circle cx="1050" cy="500" r="280" fill="url(#orb2g)" filter="url(#blur2)"/>
  <!-- Logo box -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#f26522"/>
  <text x="112" y="124" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">D</text>
  <!-- DAVAI wordmark -->
  <text x="160" y="124" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="900" fill="#e8eaf0" letter-spacing="-1">DAVAI</text>
  <!-- Badge -->
  <rect x="80" y="168" width="220" height="32" rx="16" fill="rgba(242,101,34,0.12)" stroke="#f26522" stroke-width="1" stroke-opacity="0.3"/>
  <text x="190" y="189" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#f26522" text-anchor="middle">🇦🇿 Built in Baku, Azerbaijan</text>
  <!-- Main headline -->
  <text x="80" y="290" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900" fill="#e8eaf0" letter-spacing="-2">Study smarter.</text>
  <text x="80" y="375" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="-2">
    <tspan fill="url(#textgrad)">Free AI</tspan><tspan fill="#e8eaf0"> for students.</tspan>
  </text>
  <!-- Subtext -->
  <text x="80" y="440" font-family="Inter,Arial,sans-serif" font-size="28" fill="#8892a4" letter-spacing="-0.5">AI Chat · Homework Tracker · IELTS Prep · IB Diploma · Word of the Day</text>
  <!-- Feature pills -->
  <rect x="80" y="490" width="140" height="40" rx="20" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="150" y="515" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#93c5fd" text-anchor="middle">🤖 Claude AI</text>
  <rect x="236" y="490" width="130" height="40" rx="20" fill="rgba(242,101,34,0.12)" stroke="rgba(242,101,34,0.25)" stroke-width="1"/>
  <text x="301" y="515" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#f26522" text-anchor="middle">🆓 Free forever</text>
  <rect x="382" y="490" width="150" height="40" rx="20" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="457" y="515" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#86efac" text-anchor="middle">✓ No signup</text>
  <rect x="548" y="490" width="160" height="40" rx="20" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
  <text x="628" y="515" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#c4b5fd" text-anchor="middle">🎓 IB &amp; IELTS</text>
  <!-- Right side mockup card -->
  <rect x="780" y="220" width="360" height="280" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="780" y="220" width="360" height="48" rx="20" fill="rgba(255,255,255,0.03)"/>
  <rect x="780" y="248" width="360" height="20" fill="rgba(255,255,255,0.03)"/>
  <circle cx="808" cy="244" r="7" fill="rgba(239,68,68,0.6)"/>
  <circle cx="828" cy="244" r="7" fill="rgba(251,191,36,0.6)"/>
  <circle cx="848" cy="244" r="7" fill="rgba(34,197,94,0.6)"/>
  <text x="960" y="249" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8892a4" text-anchor="middle">🤖 DAVAI AI · Powered by Claude</text>
  <!-- Chat bubbles -->
  <rect x="800" y="285" width="220" height="36" rx="10" fill="rgba(242,101,34,0.15)" stroke="rgba(242,101,34,0.2)" stroke-width="1"/>
  <text x="814" y="308" font-family="Inter,Arial,sans-serif" font-size="13" fill="#e8eaf0">How do I write a TOK essay?</text>
  <rect x="800" y="334" width="300" height="52" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="814" y="354" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c8d4e8">Great question! A strong TOK intro</text>
  <text x="814" y="372" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c8d4e8">needs a hook, KQ, and your claim. 🎓</text>
  <rect x="800" y="400" width="180" height="36" rx="10" fill="rgba(242,101,34,0.15)" stroke="rgba(242,101,34,0.2)" stroke-width="1"/>
  <text x="814" y="423" font-family="Inter,Arial,sans-serif" font-size="13" fill="#e8eaf0">What's my IELTS band?</text>
  <!-- URL -->
  <text x="1120" y="590" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#8892a4" text-anchor="end">davai.tech</text>
</svg>